[workspace]
resolver = "2"
members = ["crates/core-types", "crates/i18n", "crates/helper-cli", "crates/fs-scan", "crates/store", "crates/retention"]

[workspace.package]
edition = "2021"
version = "0.0.1"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
